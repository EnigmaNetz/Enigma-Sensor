name: Build Release Binaries

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  # Runs before anything is built or published. Fails on a tag that does not match
  # internal/version/version.go, so a mistyped tag never becomes the latest
  # release, then creates the release as a draft with notes from
  # scripts/release-notes.sh. The build jobs upload to the draft and keep its
  # notes; checksums-and-attestations publishes it last, so the latest release
  # always has its assets.
  prepare-release:
    name: Check tag and write release notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # create the release
      pull-requests: read   # read titles and labels of the merged PRs
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # all history and tags, to find the previous tag
          persist-credentials: false

      - name: Check the tag matches version.go
        run: scripts/ci/check-tag-version.sh "$TAG"

      - name: Write release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          echo "Listing PRs merged between ${PREV:-the first commit} and $TAG"
          scripts/release-notes.sh "$PREV" "$TAG" > release-notes.md
          cat release-notes.md

      - name: Create the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file release-notes.md
          fi

  build:
    needs: prepare-release
    permissions:
      contents: write  # the called workflow's release upload steps
    uses: ./.github/workflows/build-artifacts-reusable.yml
    with:
      artifact_prefix: ${{ github.ref_name }}
      retention_days: 90
      upload_to_release: true

  # Checksums and provenance are made from the assets as published, so they cover
  # exactly the bytes customers download; the attestation shows this workflow
  # published them. Customers verify with `gh attestation verify <file>
  # --repo EnigmaNetz/Enigma-Sensor --signer-workflow
  # EnigmaNetz/Enigma-Sensor/.github/workflows/go-build-release.yml`.
  checksums-and-attestations:
    name: Publish SHA256SUMS and attestations
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download release assets
        run: |
          mkdir assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets --pattern 'enigma-sensor-*'
          cd assets
          expected=(
            "enigma-sensor-windows-$TAG.exe"
            "enigma-sensor-$TAG-linux-release.zip"
            "enigma-sensor-linux-amd64-$TAG.tar.gz"
            "enigma-sensor-macos-$TAG.tar.gz"
          )
          diff <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' * | sort) || {
            echo "::error::Release assets differ from the expected set (< expected, > found)"
            exit 1
          }

      - name: Write SHA256SUMS
        working-directory: assets
        run: sha256sum enigma-sensor-* > ../SHA256SUMS && cat ../SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: SHA256SUMS

      - name: Upload SHA256SUMS to the release
        run: gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

      # Last step: until now the release was a draft, invisible to the Releases API
      # that Enigma-Subscriber reads, so a failed build never becomes the latest.
      - name: Publish the release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
