name: Go Tests

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  # golangci-lint with .golangci.yml (govet, staticcheck, errcheck, gosec). Fails on any
  # finding. GOOS lints each platform's build-tagged code from one Linux runner.
  lint:
    name: Lint (${{ matrix.goos }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: amd64

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version: '1.27.x'
        cache: false

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
      with:
        version: v2.15.0

  test:
    # The Go version is left out of the name so the required check names in the
    # main ruleset stay the same across Go upgrades.
    name: Run Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ['1.27.x']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 2  # the merge commit and its parents; the coverage steps read the PR base

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Install dependencies
      run: go mod download

    - name: Remove stray .out file (Windows workaround)
      if: runner.os == 'Windows'
      run: if exist .out del .out
      shell: cmd

    - name: Remove stray .out file (Unix workaround)
      if: runner.os != 'Windows'
      run: rm -f .out

    # The ubuntu leg also writes a coverage profile (atomic is required with -race).
    # Only that leg is measured, so Windows-only and macOS-only code counts toward no coverage figure.
    - name: Run tests
      run: go test -v -race ${{ matrix.os == 'ubuntu-latest' && '-coverprofile=coverage.out -covermode=atomic' || '' }} ./...

    # THIRD_PARTY_NOTICES ships in every release artifact. Regenerate it and fail if the
    # committed copy no longer matches go.mod or the hand-maintained sections. After the tests,
    # and even when they fail, so a stale file and a failing test are both reported.
    - name: Check THIRD_PARTY_NOTICES is up to date
      if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
      run: |
        scripts/third-party-notices/generate.sh
        git diff --exit-code THIRD_PARTY_NOTICES

    # ReportGenerator reads Cobertura, not Go profiles; the converter comes through Go's
    # checksum-verified module proxy and runs on the matrix Go version.
    - name: Convert coverage to Cobertura
      if: always() && matrix.os == 'ubuntu-latest'
      continue-on-error: true
      run: |
        if [ -f coverage.out ]; then
          go tool cover -func=coverage.out | tail -1
          go run github.com/boumenot/gocover-cobertura@v1.5.0 < coverage.out > coverage.xml
        else
          echo "No coverage.out was produced."
        fi

    - name: Set up .NET for ReportGenerator
      if: always() && matrix.os == 'ubuntu-latest'
      continue-on-error: true
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
      with:
        dotnet-version: 8.x

    - name: Summarize unit coverage
      if: always() && matrix.os == 'ubuntu-latest'
      continue-on-error: true
      uses: danielpalme/ReportGenerator-GitHub-Action@861674232075b2c6bd1405a04c4bb9b150653e81  # v5.5.12
      with:
        reports: coverage.xml
        targetdir: coverage-report-unit
        reporttypes: MarkdownSummaryGithub;JsonSummary
        title: Unit coverage

    - name: Add unit coverage to the job summary
      if: always() && matrix.os == 'ubuntu-latest'
      continue-on-error: true
      run: |
        if [ -f coverage-report-unit/SummaryGithub.md ]; then
          cat coverage-report-unit/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
        else
          echo "No unit coverage report was produced." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload coverage report
      if: always() && matrix.os == 'ubuntu-latest'
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: coverage-unit
        path: |
          coverage.out
          coverage.xml
          coverage-report-unit/Summary.json
          coverage-report-unit/SummaryGithub.md
        if-no-files-found: ignore

    # The coverage rule (B1CF-2165), on the Linux leg of PRs. These are steps here, not a job, so a
    # failure fails `Run Tests (ubuntu-latest)`, which the main ruleset already requires. This repo
    # is public and Enigma-Release is private, so it cannot call the shared coverage template:
    # scripts/ci/gates.py is a copy of that template's gate, and diff-cover matches its pin.
    - name: Find the PR base
      id: base
      if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
      run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"

    - name: Check the coverage floor
      if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
      env:
        BASE_SHA: ${{ steps.base.outputs.sha }}
      run: |
        python3 scripts/ci/gates.py coverage --reports coverage.xml \
          --floor-file .github/coverage-floors.json --suite unit --base-sha "$BASE_SHA"

    - name: Require 80% coverage on changed lines
      if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
      env:
        BASE_SHA: ${{ steps.base.outputs.sha }}
      # *.pb.go is generated, and proto-drift.yml forces regenerating it, so it isn't testable here.
      run: |
        status=0
        pipx run diff-cover==10.6.0 coverage.xml --compare-branch "$BASE_SHA" --exclude '*.pb.go' \
          --fail-under 80 > diff-cover.txt 2>&1 || status=$?
        cat diff-cover.txt
        {
          echo "### Changed-line coverage (need 80%)"
          echo '```'
          cat diff-cover.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        exit "$status"
