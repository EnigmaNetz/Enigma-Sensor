name: Go Tests

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ['1.24.x']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Install dependencies
      run: go mod download

    - name: Remove stray .out file (Windows workaround)
      if: runner.os == 'Windows'
      run: if exist .out del .out
      shell: cmd

    - name: Remove stray .out file (Unix workaround)
      if: runner.os != 'Windows'
      run: rm -f .out

    # The ubuntu leg also writes a coverage profile (atomic is required with -race).
    # Platform-gated packages are measured only on the leg that runs them.
    - name: Run tests
      run: go test -v -race ${{ matrix.os == 'ubuntu-latest' && '-coverprofile=coverage.out -covermode=atomic' || '' }} ./...

    - name: Coverage summary (report-only)
      if: always() && matrix.os == 'ubuntu-latest'
      continue-on-error: true
      run: |
        [ -f coverage.out ] && go tool cover -func=coverage.out | tail -1
        go run ./.github/scripts/coveragesummary coverage.out >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage report
      if: always() && matrix.os == 'ubuntu-latest'
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: coverage-unit
        path: coverage.out
        if-no-files-found: ignore
