name: TruffleHog Secret Scanning

# Self-contained, unlike the other repos' thin callers: this repo is public, and
# GitHub does not let public repos call reusable workflows in the private
# Enigma-Release repo. Keep in step with Enigma-Release's secret-scan-template.yml, except that the
# template's full scan passes --json, which is left out here on purpose: Actions logs are public.
# No Slack step: Actions logs are public here, and the template's webhook would appear in them.

on:
  pull_request:
    branches: ["main"]
  schedule:
    # Daily scan at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Full history for comprehensive scanning

      # Dependabot bumps the action's SHA and comment but not `version:`, which is how they drifted.
      - name: Check the TruffleHog action and CLI versions match
        run: |
          file=.github/workflows/secret-scan.yml
          action=$(grep -oE 'trufflesecurity/trufflehog@[0-9a-f]{40} +# v[0-9.]+' "$file" | sed -E 's/.*# v//' | sort -u)
          cli=$(grep -E '^ +version: ' "$file" | sed -E 's/^ +version: ([0-9.]+).*/\1/' | sort -u)
          if [ -z "$action" ] || [ "$action" != "$cli" ]; then
            echo "::error file=$file::TruffleHog action is '$action' but the CLI version: is '$cli'. Set them to one release."
            exit 1
          fi

      # PRs: scan only the commits in the PR.
      - name: TruffleHog OSS - PR Scan
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb  # v3.99.8
        with:
          path: .
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          version: 3.99.7  # pins the CLI image too; the action defaults to "latest"
          extra_args: --exclude-paths=secret-scanning/exclude-paths.txt --no-verification --exclude-detectors=Enigma

      # Schedule and manual runs: scan history from the cutoff commit. The cutoff is
      # this repo's first commit because it had never been scanned; after any findings
      # are remediated, move it to the cleanup commit, as the other repos do.
      - name: TruffleHog OSS - Full Scan
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb  # v3.99.8
        with:
          path: .
          base: 6c317d7854205aa1ad9421fddad7b5ddccfa388c  # trufflehog:ignore
          version: 3.99.7
          extra_args: --exclude-paths=secret-scanning/exclude-paths.txt --no-verification --exclude-detectors=Enigma
