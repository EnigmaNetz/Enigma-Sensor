name: TruffleHog Secret Scanning

# Self-contained, unlike the other repos' thin callers: this repo is public, and
# GitHub does not let public repos call reusable workflows in the private
# Enigma-Release repo. Keep in step with Enigma-Release's secret-scan-template.yml.
# No Slack step: Actions logs are public here, and the template's webhook would appear in them.

on:
  pull_request:
    branches: ["main"]
  schedule:
    # Daily scan at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Full history for comprehensive scanning

      # PRs: scan only the commits in the PR.
      - name: TruffleHog OSS - PR Scan
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6  # v3.97.5
        with:
          path: .
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          version: 3.97.5  # pins the CLI image too; the action defaults to "latest"
          extra_args: --exclude-paths=secret-scanning/exclude-paths.txt --no-verification --exclude-detectors=Enigma

      # Schedule and manual runs: scan history from the cutoff commit. The cutoff is
      # this repo's first commit because it had never been scanned; after any findings
      # are remediated, move it to the cleanup commit, as the other repos do.
      - name: TruffleHog OSS - Full Scan
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6  # v3.97.5
        with:
          path: .
          base: 6c317d7854205aa1ad9421fddad7b5ddccfa388c  # trufflehog:ignore
          version: 3.97.5
          extra_args: --exclude-paths=secret-scanning/exclude-paths.txt --no-verification --exclude-detectors=Enigma
