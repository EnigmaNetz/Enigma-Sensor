name: TruffleHog Secret Scanning

# Thin caller of the shared workflow in EnigmaNetz/Enigma-Release.
# Triggers stay here so GitHub registers them on this repo. The scan logic
# (PR-changed-files vs full-history) lives in the shared template.

on:
  pull_request:
    branches: ["main"]
  schedule:
    # Daily scan at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allows manual triggering from GitHub Actions UI

permissions:
  contents: read

# No `secrets: inherit`: the shared template reads only `vars`, so no secrets are passed.
jobs:
  scan:
    uses: EnigmaNetz/Enigma-Release/.github/workflows/secret-scan-template.yml@main
    with:
      repo-display-name: enigma-sensor
      # Root commit: the first scheduled/manual run covers full history. After findings
      # are remediated, bump this to the cleanup commit, as the other repos do.
      trufflehog-base-sha: 6c317d7854205aa1ad9421fddad7b5ddccfa388c
